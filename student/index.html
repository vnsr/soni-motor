<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My driving · Soni Motor</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181C22" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Hind+Vadodara:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column, like the practice app; the student's own progress card, timetable and licence dates */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E7EC; --fg:#15191F; --muted:#59616D; --line:#D3D9E0;
  --accent:#C41E2A; --accent-soft:#FBE3E4; --accent-ink:#FFFFFF;
  --ok:#1B7A47; --ok-soft:#DDF2E5; --warn:#9A5800; --warn-soft:#FCEBD3;
  --f-body:'Hind Vadodara','Noto Sans Gujarati','Shruti',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Barlow Condensed','Hind Vadodara','Arial Narrow',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#181C22; --sunk:#222831; --fg:#EBEEF2; --muted:#9EA6B2; --line:#2E353F;
  --accent:#FF6B74; --accent-soft:#3B1A1E; --accent-ink:#0F1216;
  --ok:#5ACB8A; --ok-soft:#142E20; --warn:#F0B055; --warn-soft:#352812; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#181C22; --sunk:#222831; --fg:#EBEEF2; --muted:#9EA6B2; --line:#2E353F;
  --accent:#FF6B74; --accent-soft:#3B1A1E; --accent-ink:#0F1216;
  --ok:#5ACB8A; --ok-soft:#142E20; --warn:#F0B055; --warn-soft:#352812; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px}
.lplate{width:36px;height:36px;flex:none;border-radius:7px;background:#fff;border:2.5px solid #C41E2A;display:grid;place-items:center;font:700 25px/1 var(--f-disp);color:#C41E2A}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{display:block;font-size:16px}
.brand span{font-size:12.5px;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.lang button{border:0;background:none;padding:5px 11px;font-size:14px;cursor:pointer;color:var(--muted);min-height:34px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;line-height:1.2;margin:0}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.big{display:flex;align-items:baseline;gap:6px;font:700 46px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted)}
.bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .ck{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;margin-top:2px}
.list li.on .ck{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.list li.on span{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.lesson{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.lesson b{font-variant-numeric:tabular-nums;min-width:52px}
.badge{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.due{background:var(--warn-soft);color:var(--warn)}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:15px;margin:0}
.btn{border:0;border-radius:12px;min-height:50px;padding:10px 18px;font-weight:700;font-size:16.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.btn.wa{background:var(--ok);color:var(--accent-ink)}
.btn[disabled]{opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label,.lbl{font-size:14.5px;font-weight:600}
.f input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:48px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.err{color:var(--accent);font-weight:600;font-size:15px;margin:0}
.center{text-align:center}
.note{color:var(--muted);font-size:13px;margin:0}
</style>
<script src="../config.js"></script>
</head>
<body>
<header class="top"><div class="lplate" aria-hidden="true">L</div><div class="brand"><b id="bName">Soni Motor</b><span id="bSub"></span></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="gu">ગુ</button><button type="button" data-lang="en">EN</button></div></header>
<main id="root"></main>

<script>
/* The student's own page. The link holds a private code (?t=…) that the school sends on WhatsApp; the page
   remembers it on this phone so it opens again from the home screen. It shows only this student's progress. */
const API_URL = (window.SONI_CONFIG && window.SONI_CONFIG.API_URL) || '';
const DEMO = !API_URL || /[?&]demo\b/.test(location.search);
const QUIZ_URL = new URL('../quiz/', location.href.split(/[?#]/)[0]).href;
const SKILLS = ['controls', 'moveoff', 'clutch', 'steering', 'turns', 'signals', 'traffic', 'reverse', 'parking', 'slope', 'rto'];
const DOCS = ['id', 'address', 'age', 'photos', 'll'];
const TXT = {
  en: { sub: 'Training School · Karelibaug, Vadodara', hello: n => `Hello ${n}`, title: 'Your driving lessons',
    lessons: 'Lessons done', skills: 'What you can already do', skillsOf: (a, b) => `${a} of ${b}`, next: 'Your next lessons', noNext: 'No lesson booked yet.',
    ask: 'Ask for a lesson time', askHint: 'The school confirms the time on WhatsApp or by phone.', date: 'Date', when: 'Time of day',
    want: { morning: 'Morning', afternoon: 'Afternoon', evening: 'Evening' }, note: 'Note (optional)', send: 'Send request', sending: 'Sending…',
    asked: 'Asked for', sent: 'Request sent. The school will confirm the time.', errDate: 'Choose a date in the next 30 days.', errLimit: 'You already have 3 requests waiting.',
    fees: 'Fees', price: 'Course fee', paid: 'Paid', due: 'Still to pay', clear: 'Paid in full',
    licence: 'Your licence', llDate: 'Learner licence issued', testFrom: 'Driving test possible from', llUntil: 'Learner licence valid until', testDate: 'Driving test',
    passed: 'Passed the driving test. Congratulations!', expired: 'Your learner licence has run out. Please talk to the school.',
    noLL: 'Once you have your learner licence, the school adds the date here and you can see when you can take the driving test.',
    docs: 'Documents the school has', doc: { id: 'ID proof (Aadhaar)', address: 'Address proof', age: 'Age proof', photos: 'Passport photos', ll: 'Learner licence copy' },
    share: 'Tell a friend', shareHint: 'Send your friends the free learner licence practice. If they join, the school knows they came through you.',
    shareBtn: 'Share the practice', shareMsg: u => `Free learner's licence practice in Gujarati and English from Soni Motor Training School, Vadodara: ${u}`,
    practice: 'Practise for the LL test', call: 'Call the school', whatsapp: 'WhatsApp the school', trainer: 'Trainer',
    bad: 'This link does not work any more. Ask the school on WhatsApp for your new link.', limit: 'Too many visits today. Please try again tomorrow.',
    offline: 'Could not load. Check the internet and try again.', retry: 'Try again', none: '—', done: 'Course completed',
    private: 'This page is only for you. Please do not share this link.', demo: 'Demo with a made-up student.',
    skill: { controls: 'Seat, mirrors, seat belt, controls', moveoff: 'Starting, moving off, stopping', clutch: 'Clutch control and gear changes', steering: 'Steering and keeping in lane', turns: 'Left and right turns with indicator', signals: 'Signals, signs, right of way', traffic: 'Driving in city traffic', reverse: 'Reversing straight and round a corner', parking: 'Parking at the roadside and in a slot', slope: 'Moving off on a slope', rto: 'RTO test-track practice' } },
  gu: { sub: 'ટ્રેનિંગ સ્કૂલ · કારેલીબાગ, વડોદરા', hello: n => `નમસ્તે ${n}`, title: 'તમારા ડ્રાઇવિંગ લેસન',
    lessons: 'થયેલા લેસન', skills: 'તમે શું શીખી ગયા', skillsOf: (a, b) => `${b}માંથી ${a}`, next: 'તમારા આગળના લેસન', noNext: 'હજી કોઈ લેસન બુક નથી.',
    ask: 'લેસનનો સમય માંગો', askHint: 'સ્કૂલ વૉટ્સઍપ કે ફોનથી સમય નક્કી કરશે.', date: 'તારીખ', when: 'સમય',
    want: { morning: 'સવારે', afternoon: 'બપોરે', evening: 'સાંજે' }, note: 'નોંધ (ઇચ્છા હોય તો)', send: 'વિનંતી મોકલો', sending: 'મોકલી રહ્યા છીએ…',
    asked: 'માંગેલો સમય', sent: 'વિનંતી મોકલાઈ. સ્કૂલ સમય નક્કી કરશે.', errDate: 'આવતા 30 દિવસમાંની તારીખ પસંદ કરો.', errLimit: 'તમારી 3 વિનંતી પહેલેથી બાકી છે.',
    fees: 'ફી', price: 'કોર્સની ફી', paid: 'ચૂકવેલ', due: 'બાકી', clear: 'પૂરી ચૂકવી',
    licence: 'તમારું લાઇસન્સ', llDate: 'લર્નિંગ લાઇસન્સ મળ્યું', testFrom: 'ડ્રાઇવિંગ ટેસ્ટ આ તારીખથી', llUntil: 'લર્નિંગ લાઇસન્સ માન્ય', testDate: 'ડ્રાઇવિંગ ટેસ્ટ',
    passed: 'ડ્રાઇવિંગ ટેસ્ટ પાસ. અભિનંદન!', expired: 'તમારા લર્નિંગ લાઇસન્સની મુદત પૂરી થઈ છે. સ્કૂલ સાથે વાત કરો.',
    noLL: 'લર્નિંગ લાઇસન્સ મળે પછી સ્કૂલ અહીં તારીખ ઉમેરશે, અને ડ્રાઇવિંગ ટેસ્ટ ક્યારથી આપી શકાય તે દેખાશે.',
    docs: 'સ્કૂલ પાસેના દસ્તાવેજો', doc: { id: 'ઓળખનો પુરાવો (આધાર)', address: 'સરનામાનો પુરાવો', age: 'ઉંમરનો પુરાવો', photos: 'પાસપોર્ટ ફોટા', ll: 'લર્નિંગ લાઇસન્સની નકલ' },
    share: 'મિત્રને કહો', shareHint: 'મિત્રોને મફત લર્નિંગ લાઇસન્સ પ્રેક્ટિસ મોકલો. તેઓ જોડાશે તો સ્કૂલને ખબર પડશે કે તમારા કહેવાથી આવ્યા.',
    shareBtn: 'પ્રેક્ટિસ શેર કરો', shareMsg: u => `સોની મોટર ટ્રેનિંગ સ્કૂલ, વડોદરા તરફથી ગુજરાતી અને અંગ્રેજીમાં મફત લર્નિંગ લાઇસન્સ પ્રેક્ટિસ: ${u}`,
    practice: 'LL ટેસ્ટની પ્રેક્ટિસ કરો', call: 'સ્કૂલને ફોન કરો', whatsapp: 'સ્કૂલને વૉટ્સઍપ કરો', trainer: 'ટ્રેનર',
    bad: 'આ લિંક હવે ચાલતી નથી. નવી લિંક માટે સ્કૂલને વૉટ્સઍપ કરો.', limit: 'આજે ઘણી વાર ખોલ્યું. કાલે ફરી પ્રયત્ન કરો.',
    offline: 'ખૂલી શક્યું નહીં. ઇન્ટરનેટ તપાસીને ફરી પ્રયત્ન કરો.', retry: 'ફરી પ્રયત્ન કરો', none: '—', done: 'કોર્સ પૂરો',
    private: 'આ પેજ ફક્ત તમારા માટે છે. આ લિંક બીજાને ન મોકલશો.', demo: 'ડેમો: કાલ્પનિક વિદ્યાર્થી.',
    skill: { controls: 'સીટ, અરીસા, સીટબેલ્ટ અને કંટ્રોલ', moveoff: 'ગાડી ચાલુ કરવી, ઉપાડવી અને રોકવી', clutch: 'ક્લચ કંટ્રોલ અને ગિયર બદલવા', steering: 'સ્ટિયરિંગ અને લેનમાં રહેવું', turns: 'ઇન્ડિકેટર આપી ડાબે-જમણે વળવું', signals: 'સિગ્નલ, ટ્રાફિક ચિહ્નો અને રસ્તાનો હક', traffic: 'શહેરના ટ્રાફિકમાં ગાડી ચલાવવી', reverse: 'સીધું અને વળાંકમાં રિવર્સ લેવું', parking: 'રસ્તાની બાજુએ અને જગ્યામાં પાર્કિંગ', slope: 'ઢાળ પર ગાડી ઉપાડવી', rto: 'RTO ટેસ્ટ ટ્રૅકની પ્રેક્ટિસ' } }
};
const MON = { en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], gu: ['જાન્યુ', 'ફેબ્રુ', 'માર્ચ', 'એપ્રિલ', 'મે', 'જૂન', 'જુલાઈ', 'ઑગસ્ટ', 'સપ્ટે', 'ઑક્ટો', 'નવે', 'ડિસે'] };
const DAY = { en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], gu: ['રવિ', 'સોમ', 'મંગળ', 'બુધ', 'ગુરુ', 'શુક્ર', 'શનિ'] };

const store = {
  get(k, d) { try { const v = localStorage.getItem('sms.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sms.' + k, JSON.stringify(v)); } catch (e) { } }
};
/* the private code: from the link, else the one this phone saw last; then dropped from the address bar */
const fromUrl = (/[?&]t=([a-z0-9]{20,40})/.exec(location.search) || [])[1];
if (fromUrl) { store.set('t', fromUrl); try { history.replaceState(null, '', location.pathname + (DEMO && /demo/.test(location.search) ? '?demo' : '')); } catch (e) { } }
const TOKEN = fromUrl || store.get('t', '');
const S = { lang: store.get('lang', 'gu'), data: store.get('data', null), err: '', reqMsg: '', reqErr: '', want: 'evening' };
const T = () => TXT[S.lang];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
function addDays(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function addMonths(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); }
function fd(s, day) { if (!s) return ''; const d = new Date(s + 'T00:00:00Z'); return (day ? DAY[S.lang][d.getUTCDay()] + ', ' : '') + d.getUTCDate() + ' ' + MON[S.lang][d.getUTCMonth()]; }
const istToday = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);

function post(action, payload) {
  if (DEMO) return new Promise(res => setTimeout(() => res(demo(action, payload)), 250));
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) }).then(r => r.json());
}
async function load() {
  if (!TOKEN && !DEMO) { S.err = 'bad'; render(); return; }
  try {
    const r = await post('student', { Token: TOKEN });
    if (!r.ok) { S.err = r.error === 'LIMIT' ? 'limit' : 'bad'; if (S.err === 'bad') { S.data = null; store.set('data', null); } render(); return; }
    S.data = r; S.err = ''; store.set('data', r); render();
  } catch (e) { S.err = S.data ? '' : 'offline'; render(); }
}

function render() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-lang]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.lang === S.lang); b.onclick = () => { S.lang = b.dataset.lang; store.set('lang', S.lang); render(); }; });
  const t = T(), D = S.data;
  $('bSub').textContent = t.sub;
  if (D && D.school && D.school.school) $('bName').textContent = D.school.school;
  if (!D) {
    $('root').innerHTML = S.err ? `<p class="warn">${S.err === 'limit' ? t.limit : S.err === 'offline' ? t.offline : t.bad}</p>${S.err === 'offline' ? `<button class="btn primary" id="retry">${t.retry}</button>` : ''}`
      : '<div class="lplate" style="margin:40px auto" aria-hidden="true">L</div>';
    if ($('retry')) $('retry').onclick = load;
    return;
  }
  const s = D.student, td = D.today || istToday(), ph = String(D.school.phone || '');
  const list = SKILLS.filter(k => !(k === 'clutch' && s.transmission === 'Automatic')), have = new Set(s.skills);
  const nHave = list.filter(k => have.has(k)).length, pct = s.total ? Math.min(100, s.done / s.total * 100) : 0;
  const ll = s.llDate ? { from: addDays(s.llDate, 30), until: addMonths(s.llDate, 6) } : null;
  const due = Math.max(0, s.price - s.paid);
  const shareUrl = `${QUIZ_URL}?src=student&r=${s.ref}`;
  $('root').innerHTML = `
    ${DEMO ? `<p class="warn">${t.demo}</p>` : ''}
    <div><h1>${esc(t.hello(s.name))}</h1><p class="sub">${esc(t.title)}${s.car ? ' · ' + esc(s.car) : ''}${s.instructor ? ' · ' + t.trainer + ': ' + esc(s.instructor) : ''}</p></div>
    <section class="card"><div class="lbl">${t.lessons}</div>
      <div class="big">${s.done}<small>/ ${s.total || '–'}</small></div>
      ${s.total ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
      ${s.status === 'Completed' ? `<p class="sub" style="margin-top:8px"><span class="badge ok">${t.done}</span></p>` : ''}</section>
    <section class="card"><h2>${t.next}</h2>
      ${s.next.length ? s.next.map(b => `<div class="lesson"><b>${esc(b.slot)}</b><div>${fd(b.date, true)}<div class="sub">${esc(b.car)}</div></div></div>`).join('') : `<p class="sub">${t.noNext}</p>`}
      ${s.requests.length ? `<p class="sub" style="margin-top:8px">${t.asked}: ${s.requests.map(r => fd(r.date, true) + ' · ' + esc(t.want[r.want] || r.want)).join(', ')}</p>` : ''}</section>
    ${s.status === 'Active' ? `<section class="card"><h2>${t.ask}</h2><p class="sub" style="margin:-4px 0 12px">${t.askHint}</p>
      <form id="rq">
        <div class="f"><label for="rqD">${t.date}</label><input type="date" id="rqD" min="${td}" max="${addDays(td, 30)}" value="${addDays(td, 1)}" required></div>
        <div class="f"><span class="lbl">${t.when}</span><div class="chips">${Object.keys(t.want).map(k => `<button type="button" class="chip" data-w="${k}" aria-pressed="${S.want === k}">${t.want[k]}</button>`).join('')}</div></div>
        <div class="f"><label for="rqN">${t.note}</label><input id="rqN" maxlength="120" autocomplete="off"></div>
        ${S.reqErr ? `<p class="err" role="alert">${S.reqErr}</p>` : ''}${S.reqMsg ? `<p class="sub" role="status" style="color:var(--ok);font-weight:600;margin-bottom:10px">${S.reqMsg}</p>` : ''}
        <button class="btn primary" type="submit" id="rqB">${t.send}</button></form></section>` : ''}
    <section class="card"><h2>${t.skills} <span class="sub">· ${t.skillsOf(nHave, list.length)}</span></h2>
      <ul class="list">${list.map(k => `<li class="${have.has(k) ? 'on' : ''}"><span class="ck" aria-hidden="true">${have.has(k) ? '✓' : ''}</span><span>${esc(t.skill[k])}</span></li>`).join('')}</ul></section>
    <section class="card"><h2>${t.licence}</h2>
      ${s.testResult === 'Pass' ? `<p class="badge ok" style="display:inline-block;margin:0 0 8px">${t.passed}</p>` : ''}
      ${ll && ll.until < td && s.testResult !== 'Pass' ? `<p class="warn" style="margin-bottom:8px">${t.expired}</p>` : ''}
      ${ll ? `<dl class="kv"><dt>${t.llDate}</dt><dd>${fd(s.llDate)}</dd>${s.testResult !== 'Pass' ? `<dt>${t.testFrom}</dt><dd>${fd(ll.from, true)}</dd><dt>${t.llUntil}</dt><dd>${fd(ll.until)}</dd>` : ''}${s.testDate ? `<dt>${t.testDate}</dt><dd>${fd(s.testDate, true)}</dd>` : ''}</dl>` : `<p class="sub">${t.noLL}</p>`}
      <h2 style="margin-top:14px;font-size:16px">${t.docs}</h2>
      <ul class="list">${DOCS.map(k => `<li class="${s.docs.includes(k) ? 'on' : ''}"><span class="ck" aria-hidden="true">${s.docs.includes(k) ? '✓' : ''}</span><span>${t.doc[k]}</span></li>`).join('')}</ul></section>
    ${s.price ? `<section class="card"><h2>${t.fees}</h2><dl class="kv"><dt>${t.price}</dt><dd>${inr(s.price)}</dd><dt>${t.paid}</dt><dd>${inr(s.paid)}</dd>
      <dt>${t.due}</dt><dd>${due > 0 ? `<span class="badge due">${inr(due)}</span>` : `<span class="badge ok">${t.clear}</span>`}</dd></dl></section>` : ''}
    <section class="card"><h2>${t.share}</h2><p class="sub" style="margin:-4px 0 12px">${t.shareHint}</p>
      <div class="row2"><button class="btn ghost" id="share">${t.shareBtn}</button><a class="btn ghost" href="${esc(QUIZ_URL)}?src=student">${t.practice}</a></div></section>
    ${ph ? `<div class="row2"><a class="btn ghost" href="tel:+91${esc(ph)}">${t.call}</a><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/91${esc(ph)}">${t.whatsapp}</a></div>` : ''}
    <p class="note center">${t.private}</p>`;
  const f = $('rq');
  if (f) {
    f.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { S.want = b.dataset.w; f.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    f.onsubmit = async e => {
      e.preventDefault(); const d = $('rqD').value;
      if (!d || d < td || d > addDays(td, 30)) { S.reqErr = t.errDate; S.reqMsg = ''; render(); return; }
      $('rqB').disabled = true; $('rqB').textContent = t.sending;
      try {
        const r = await post('studentRequest', { Token: TOKEN, Date: d, Want: S.want, Note: $('rqN').value.trim() });
        if (!r.ok) { S.reqErr = r.error === 'LIMIT' ? t.errLimit : r.error === 'DATE' ? t.errDate : t.offline; S.reqMsg = ''; render(); return; }
        S.reqErr = ''; S.reqMsg = t.sent; await load();
      } catch (x) { S.reqErr = t.offline; S.reqMsg = ''; render(); }
    };
  }
  $('share').onclick = async () => {
    const text = t.shareMsg(shareUrl);
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
  };
}

/* demo: a made-up student, nothing is sent */
function demo(action, p) {
  const td = istToday();
  const D = window.__demo || (window.__demo = { ok: true, today: td, school: { school: 'Soni Motor Training School', phone: '1000000001' },
    student: { name: 'Meera', status: 'Active', car: 'Maruti Baleno', transmission: 'Automatic', done: 7, total: 12, last: addDays(td, -2),
      skills: ['controls', 'moveoff', 'steering', 'turns', 'signals'], price: 6000, paid: 3000, licence: 'Learner', llDate: addDays(td, -40), testDate: addDays(td, 9), testResult: '',
      docs: ['id', 'address', 'photos'], next: [{ date: addDays(td, 1), slot: '07:30', car: 'Maruti Baleno' }, { date: addDays(td, 3), slot: '07:30', car: 'Maruti Baleno' }],
      requests: [], instructor: 'Ravi', ref: 'demo0000' } });
  if (action === 'studentRequest') { D.student.requests.push({ date: p.Date, want: p.Want }); return { ok: true }; }
  return JSON.parse(JSON.stringify(D));
}

render();
load();
</script>
</body>
