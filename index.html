<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soni Motor</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Soni Motor">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-hand phone app — fixed header, single scrolling column, bottom tab bar; L-plate red on cool white */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --sunk:#E8EAEE; --fg:#16181D; --muted:#5D6370; --line:#DADDE3;
  --accent:#C41E2A; --accent-soft:#FBE2E3; --accent-ink:#FFFFFF;
  --ok:#1C7645; --ok-soft:#DDF1E5; --warn:#9A5800; --warn-soft:#FCEBD3; --wa:#1F8F4E;
  --font:'Hind Vadodara','Noto Sans Gujarati','Shruti',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --sunk:#23272F; --fg:#ECEEF2; --muted:#A0A6B2; --line:#30353E;
  --accent:#FF6B72; --accent-soft:#3D1C1F; --accent-ink:#111317;
  --ok:#5CCB8C; --ok-soft:#153222; --warn:#F0B055; --warn-soft:#352812; --wa:#4CC27E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --sunk:#23272F; --fg:#ECEEF2; --muted:#A0A6B2; --line:#30353E;
  --accent:#FF6B72; --accent-soft:#3D1C1F; --accent-ink:#111317;
  --ok:#5CCB8C; --ok-soft:#153222; --warn:#F0B055; --warn-soft:#352812; --wa:#4CC27E; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);height:100%;overflow:hidden}
/* Header and tab bar stay put; only the content area scrolls (iPhone-safe) */
#app{height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#app.shell{display:flex;flex-direction:column;overflow:hidden}
#app.shell>.hdr,#app.shell>.demo,#app.shell>nav.tabs{flex:none}
.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hdr{position:relative;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.lplate{width:34px;height:34px;flex:none;border-radius:6px;background:#fff;border:2px solid #C41E2A;display:grid;place-items:center;font-weight:700;font-size:22px;color:#C41E2A;line-height:1}
.hdr .nm{font-weight:700;font-size:17px;line-height:1.1}
.hdr .nm span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.hdr .sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 10px;font-size:14px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;text-align:center;padding:6px 16px}

main{padding:16px 16px 28px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;line-height:1.2}
h2{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h2 .count{font-size:13px;background:var(--sunk);color:var(--muted);border-radius:999px;padding:0 8px;font-weight:500}
.sub{color:var(--muted);font-size:14px;margin:0}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:78px}
.act b{font-size:17px}
.act small{color:var(--muted);font-size:13px}
.act.primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex-direction:row;align-items:center;gap:12px;min-height:72px}
.act.primary small{color:inherit;opacity:.85}
.act.primary .plus{font-size:30px;font-weight:600;line-height:1;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.tap{cursor:pointer}
.empty{padding:14px;color:var(--muted);font-size:14px}
.prog{height:5px;background:var(--sunk);border-radius:3px;margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.badge.due{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.red{background:var(--accent-soft);color:var(--accent)}
.badge.mute{background:var(--sunk);color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{color:var(--wa);border-color:var(--wa)}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.btn.big{width:100%;min-height:50px;font-size:17px}
.btn.plus1{min-width:58px;background:var(--accent-soft);border-color:transparent;color:var(--accent);font-size:16px}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

nav.tabs{position:relative;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(env(safe-area-inset-bottom,0px) + 4px)}
nav.tabs button{border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);cursor:pointer;min-width:0}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h3{margin:0;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.lbl{font-size:14px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:46px}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.err{color:var(--accent);font-size:14px;font-weight:600}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;color:var(--muted)}
.stat .d.up{color:var(--ok)} .stat .d.down{color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
svg.bars{width:100%;height:auto;display:block}
svg.bars text{fill:var(--muted);font-size:11px;font-family:var(--font)}
svg.bars .b{fill:var(--accent)} svg.bars .b.cur{fill:var(--fg)}
svg.bars .g{stroke:var(--line)}
.sw{display:flex;align-items:center;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:mv 1s linear infinite}
@keyframes mv{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.busy{animation:none;background:var(--accent)}}

.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 16px;max-width:420px;margin:0 auto}
.gate .lplate{width:56px;height:56px;font-size:38px;border-width:3px}
.pin{font-size:28px;letter-spacing:.4em;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* v1.1: progress card, review QR, setup warning */
.sk{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;min-height:52px;text-align:left;cursor:pointer}
.sk:first-child{border-top:0}
.sk .box{width:26px;height:26px;flex:none;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.sk .box svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;visibility:hidden}
.sk[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.sk[aria-checked="true"] .box svg{visibility:visible}
.sk .lb{flex:1;min-width:0;font-size:15px}
.sk .lb small{display:block;color:var(--muted);font-size:12.5px}
.sk[aria-checked="true"] .lb{color:var(--muted)}
.skhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qrbox{background:#fff;border-radius:14px;padding:14px;align-self:center;width:min(78vw,300px)}
.qrbox svg{display:block;width:100%;height:auto}
.center{text-align:center}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:14px}
.warn b{display:block;margin-bottom:2px}
.warn ul{margin:4px 0 0;padding-left:18px}
.ver{color:var(--muted);font-size:12.5px;text-align:center}
/* v1.3: timetable */
.ttbar{display:flex;align-items:center;gap:8px}
.ttdate{flex:1;position:relative;display:flex;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 10px;cursor:pointer}
.ttdate b{display:block;font-size:17px;line-height:1.2}
.ttdate small{color:var(--muted);font-size:13px}
.ttdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.btns .sp{flex:1}
.selbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:8px 10px}
.selbar .sp{flex:1}
.grid{display:grid;grid-template-columns:46px repeat(var(--cols),minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:clip}
.grid .gh{position:sticky;top:0;z-index:1;background:var(--sunk);font-weight:700;font-size:13.5px;padding:8px 6px;border-left:1px solid var(--line);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .gh.gt{border-left:0;font-weight:600;color:var(--muted);font-size:12px}
.grid .gtm{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;padding:6px 4px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.grid .gtm.now{background:var(--accent);color:var(--accent-ink)}
.grid .gtm.past{color:var(--muted)}
.gc{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;min-height:46px;min-width:0;padding:4px 6px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-size:13px;line-height:1.2}
.gc .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;font-weight:600;max-width:100%}
.gc small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.gc.bkd{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}
.gc.blk{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--sunk) 7px 14px)}
.gc.blk .nm{font-weight:500;color:var(--muted);font-style:italic}
.gc.past{opacity:.55}
.gc.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.slot{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:8px 14px;min-height:50px;cursor:pointer}
.slot:first-child{border-top:0}
.slot .tm{width:50px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.slot .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.slot .who small{color:var(--muted);font-size:12.5px}
.slot .mute{color:var(--muted)}
.slot.bkd{box-shadow:inset 4px 0 0 var(--ok)}
.slot.blk{background:repeating-linear-gradient(135deg,var(--surface) 0 9px,var(--sunk) 9px 18px);color:var(--muted)}
.slot.past{opacity:.55}
.slot.sel{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.who{font-weight:600}
.f .who{padding:4px 0}
#print{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  #app,#toast,#busy,.scrim{display:none!important}
  #print{display:block!important;font:10pt/1.3 var(--font);color:#000}
  #print h1{font-size:15pt;margin:0}
  #print h2{font-size:11pt;margin:2px 0 8px;font-weight:600}
  #print table{width:100%;border-collapse:collapse;table-layout:fixed}
  #print th,#print td{border:1px solid #888;padding:3px 5px;text-align:left;vertical-align:top;overflow:hidden}
  #print th{background:#eee}
  #print .pday td{height:8.1mm}
  #print .pday .ph{display:block;font-size:8pt;color:#444}
  #print .pb{break-before:page}
  #print .pday th:first-child{width:27mm}
  #print .pday td:first-child{white-space:nowrap}
  #print .pday th:nth-child(3){width:28mm}
  #print .pday th:last-child{width:14mm}
  #print .pweek{font-size:8.5pt}
  #print .pweek td{height:6mm;white-space:nowrap;text-overflow:ellipsis}
  #print .pweek th:first-child{width:14mm}
  #print td.k,#print tr.k td{background:#e6e6e6;color:#444}
  #print .pfoot{font-size:8pt;color:#555;margin-top:6px}
}

</style>

</head>
<body>

<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="print" aria-hidden="true"></div>

/* dates are 'yyyy-mm-dd' strings, IST */
function istToday() { return new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function weekStart(s) { const d = new Date(s + 'T00:00:00Z'); const w = (d.getUTCDay() + 6) % 7; return addDays(s, -w); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5); }
const MON_GU = ['જાન્યુ', 'ફેબ્રુ', 'માર્ચ', 'એપ્રિલ', 'મે', 'જૂન', 'જુલાઈ', 'ઑગસ્ટ', 'સપ્ટે', 'ઑક્ટો', 'નવે', 'ડિસે'];
const MON_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY_GU = ['રવિ', 'સોમ', 'મંગળ', 'બુધ', 'ગુરુ', 'શુક્ર', 'શનિ'], DAY_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function fd(s, withDay) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00Z'), m = d.getUTCMonth(), day = d.getUTCDate();
  const base = st.lang === 'gu' ? `${n2(day)} ${MON_GU[m]}` : `${day} ${MON_EN[m]}`;
  return withDay ? (st.lang === 'gu' ? DAY_GU : DAY_EN)[d.getUTCDay()] + ', ' + base : base;
}
function rel(s) {
  const n = daysBetween(s, today());
  if (n === 0) return st.lang === 'gu' ? 'આજે' : 'today';
  if (n === 1) return st.lang === 'gu' ? 'ગઈકાલે' : 'yesterday';
  if (n === -1) return st.lang === 'gu' ? 'આવતીકાલે' : 'tomorrow';
  if (n > 0) return st.lang === 'gu' ? `${n2(n)} દિવસ પહેલાં` : `${n} days ago`;
  return st.lang === 'gu' ? `${n2(-n)} દિવસ પછી` : `in ${-n} days`;
}

  const done = r => { $('#busy').hidden = true; return r; };
  if (!IS_LIVE) return new Promise((res, rej) => setTimeout(() => { try { res(done(Mock.api(st.pin, action, payload))); } catch (e) { done(); e.server = true; rej(e); } }, 180));
  /* text/plain keeps this a simple request: no CORS preflight, which Apps Script cannot answer */
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin: st.pin, action, payload }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' })
    .then(r => r.json())
    .then(r => { done(); if (!r.ok) { const e = new Error(r.error || 'error'); e.server = true; throw e; } if (r.db) { st.offline = false; ls.set('db', r.db); } return r; })
    .catch(e => { done(); if (!e.server) e.net = true; throw e; });
}
function adopt(db) {
  st.db = db;
  if (db && db.me) {
    st.me = db.me; ls.set('me', db.me);
    if (!st.trainer || !(db.staff || []).includes(st.trainer)) { st.trainer = (db.staff || []).includes(db.me) ? db.me : ((db.staff || [])[0] || db.me); ls.set('trainer', st.trainer); }
  }
}
async function act(action, payload, okMsg) {
  try {
    const r = await call(action, payload);
    adopt(r.db); render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r.result) : okMsg);
    return r.result;
  } catch (e) {
    const m = String(e && e.message || e);
    if (m === 'PIN') { ls.del('pin'); st.pin = ''; st.pinBad = true; st.db = null; render(); return null; }
    if (m === 'TAKEN') { toast(T().taken); try { const r = await call('load'); adopt(r.db); render(); } catch (x) { } throw e; }
    toast(m === 'LOCKED' ? T().locked : T().offline); throw e;
  }
}

/* derived */
function pkgOf(id) { return (st.db.packages || []).find(p => String(p.PackageID) === String(id)); }
function pkgLabel(p) { return p ? `${p.Car} · ${p.Transmission === 'Automatic' ? (st.lang === 'gu' ? 'ઑટોમેટિક' : 'Automatic') : (st.lang === 'gu' ? 'મેન્યુઅલ' : 'Manual')}` : ''; }
function studentsX() {
  const db = st.db, L = {}, P = {};
  db.lessons.forEach(l => { const a = L[l.StudentID] || (L[l.StudentID] = { n: 0, last: '' }); a.n++; if (l.Date > a.last) a.last = l.Date; });
  db.payments.forEach(p => { P[p.StudentID] = (P[p.StudentID] || 0) + Number(p.AmountINR || 0); });
  return db.students.map(s => {
    const pk = pkgOf(s.PackageID), tot = pk ? Number(pk.Lessons) : 0, done = (L[s.ID] || {}).n || 0, paid = P[s.ID] || 0;
    return Object.assign({}, s, { Phone: String(s.Phone || ''), pk, tot, done, last: (L[s.ID] || {}).last || '', paid, bal: Math.max(0, Number(s.Price || 0) - paid) });
  });
}

function skillsFor(s) { return SKILLS.filter(k => !(k === 'clutch' && s.pk && s.pk.Transmission === 'Automatic')); }
function skillsDone(id) { return new Set((st.db.skills || []).filter(x => x.StudentID === id).map(x => x.Skill)); }
const TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function drawSkills(id) {

async function toggleSkill(id, key, on) {
  const db = st.db; db.skills = db.skills || []; const before = db.skills.slice();
  db.skills = db.skills.filter(x => !(x.StudentID === id && x.Skill === key));
  if (on) db.skills.push({ StudentID: id, Skill: key, Date: today(), LoggedBy: st.me });
  drawSkills(id);

  catch (e) { st.db.skills = before; drawSkills(id); }
}
function progressMsg(s) {
  const t = T(), list = skillsFor(s), have = skillsDone(s.ID), set = st.db.settings || {};

  const rows = list.map(k => (have.has(k) ? '✅ ' : '⬜ ') + t.skill[k]).join('\n');

  const head = st.lang === 'gu'
    ? `🚗 ${t.school} · ${t.cardTitle}\n${first} · ${s.tot ? n2(s.done) + '/' + n2(s.tot) + ' લેસન' : n2(s.done) + ' લેસન'}`
    : `🚗 ${set.SchoolName || 'Soni Motor Training School'} · ${t.cardTitle}\n${first} · ${s.done}${s.tot ? '/' + s.tot : ''} lessons`;

  return `${head}\n\n${rows}\n\n${tail}${s.Instructor ? '\n— ' + s.Instructor : ''}`;
}

function byCar(keys) { const g = {}; keys.forEach(k => { const i = k.lastIndexOf('|'); (g[k.slice(0, i)] = g[k.slice(0, i)] || []).push(k.slice(i + 1)); }); Object.values(g).forEach(a => a.sort()); return g; }

function openSlot(car, d, x) {
  const t = T(), b = bookingsOn(d, car)[x], title = `${car} · ${x}–${slotEnd(x)} · ${fd(d)}`;

/* print: builds a plain table into #print and opens the browser's print screen (Save as PDF from there) */

let sheetEl = null;
function sheet(title, body, mount) {
  closeSheet();
  sheetEl = document.createElement('div');
  sheetEl.className = 'scrim';
  sheetEl.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="btn ghost" id="shX">${T().cancel}</button></div><div class="sheet-b">${body}</div></div>`;
  document.body.appendChild(sheetEl);
  sheetEl.addEventListener('click', e => { if (e.target === sheetEl) closeSheet(); });
  $('#shX').onclick = closeSheet;
  document.body.style.overflow = 'hidden';
  wireCommon(sheetEl.querySelector('.sheet-b'));
  mount && mount(sheetEl);
}
function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; document.body.style.overflow = ''; } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let toastTm;
function toast(text, undo) {
  const el = $('#toast'); clearTimeout(toastTm);
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button type="button" id="tUndo">${T().undo}</button>` : ''}`;
  el.hidden = false;
  if (undo) $('#tUndo').onclick = () => { el.hidden = true; undo(); };
  toastTm = setTimeout(() => el.hidden = true, undo ? 8000 : 2500);
}

    if (action === 'addPayment') { result = { ID: rid('P'), Date: p.Date, StudentID: p.StudentID, AmountINR: p.AmountINR, Mode: p.Mode, LoggedBy: p.LoggedBy }; db.payments.push(result); }
    if (action === 'setSlots') {
      const days = p.Type === 'Blocked' ? Math.max(1, +p.Days || 1) : 1, dates = Array.from({ length: days }, (_, i) => addDays(p.Date, i));
      const hit = b => b.Car === p.Car && dates.includes(b.Date) && p.Slots.includes(b.Slot);
      if (db.bookings.some(hit) && !p.Replace) throw new Error('TAKEN');
      db.bookings = db.bookings.filter(b => !hit(b));
      dates.forEach(d => p.Slots.forEach(sl => db.bookings.push({ ID: rid('B'), Date: d, Car: p.Car, Slot: sl, Type: p.Type, StudentID: p.Type === 'Booked' ? p.StudentID : '', Note: p.Note || '', LoggedBy: me })));
    }
    if (action === 'clearSlots') db.bookings = db.bookings.filter(b => !(b.Car === p.Car && b.Date === p.Date && p.Slots.includes(b.Slot)));
    const out = copy(); out.me = me;
    return { db: out, result };
  }
  return { api };
})();

render();
