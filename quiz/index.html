<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LL Practice · Soni Motor</title>
<meta name="description" content="Free learner's licence practice in Gujarati and English: 197 questions on road signs and rules, practice mode and 15-question tests. From Soni Motor Training School, Vadodara.">
<meta property="og:title" content="લર્નિંગ લાઇસન્સ પ્રેક્ટિસ · Soni Motor">
<meta property="og:description" content="197 પ્રશ્નો, પ્રેક્ટિસ અને 15 પ્રશ્નોની ટેસ્ટ, ગુજરાતી અને અંગ્રેજીમાં. Free learner's licence practice.">
<meta property="og:image" content="https://vnsr.github.io/soni-motor/icon-512.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181C22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LL Practice">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Hind+Vadodara:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed header, one scrolling column like an RTO test screen; lane-marking progress strip, sign plate, three answers */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E7EC; --fg:#15191F; --muted:#59616D; --line:#D3D9E0;
  --accent:#C41E2A; --accent-soft:#FBE3E4; --accent-ink:#FFFFFF;
  --ok:#1B7A47; --ok-soft:#DDF2E5; --bad:#B4232F; --bad-soft:#FBE3E4; --warn:#9A5800; --warn-soft:#FCEBD3; --lane:#C9D0D8;
  --f-body:'Hind Vadodara','Noto Sans Gujarati','Shruti',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Barlow Condensed','Hind Vadodara','Arial Narrow',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#181C22; --sunk:#222831; --fg:#EBEEF2; --muted:#9EA6B2; --line:#2E353F;
  --accent:#FF6B74; --accent-soft:#3B1A1E; --accent-ink:#0F1216;
  --ok:#5ACB8A; --ok-soft:#142E20; --bad:#FF7A84; --bad-soft:#3B1A1E; --warn:#F0B055; --warn-soft:#352812; --lane:#39414C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#181C22; --sunk:#222831; --fg:#EBEEF2; --muted:#9EA6B2; --line:#2E353F;
  --accent:#FF6B74; --accent-soft:#3B1A1E; --accent-ink:#0F1216;
  --ok:#5ACB8A; --ok-soft:#142E20; --bad:#FF7A84; --bad-soft:#3B1A1E; --warn:#F0B055; --warn-soft:#352812; --lane:#39414C; color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--f-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* fixed header, only the content scrolls (iPhone-safe) */
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column}
header.top{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

.lplate{width:36px;height:36px;flex:none;border-radius:7px;background:#fff;border:2.5px solid #C41E2A;display:grid;place-items:center;font:700 25px/1 var(--f-disp);color:#C41E2A}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{display:block;font-size:16px}
.brand span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.lang button{border:0;background:none;padding:5px 11px;font-size:14px;cursor:pointer;color:var(--muted);min-height:34px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;font-size:20px;flex:none}

h1{font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:18px;margin:0}
.intro{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:60ch}
.sub{color:var(--muted);font-size:14px;margin:0}

/* readiness */
.ready{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface)}
.ready .st{display:flex;align-items:center;gap:10px}
.ready .dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--lane)}
.ready.yes{border-color:var(--ok)} .ready.yes .dot{background:var(--ok)}
.ready.no .dot{background:var(--warn)}
.ready .st b{font-size:19px}
.meter{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14.5px;align-items:center}
.bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.meter .v{font-variant-numeric:tabular-nums;font-weight:600}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:8px;border-radius:2px;background:var(--lane)}
.pips i.ok{background:var(--ok)} .pips i.bad{background:var(--bad)}

.btn{border:0;border-radius:12px;min-height:52px;padding:10px 18px;font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.btn.wa{background:var(--ok);color:var(--accent-ink)}
.btn.full{width:100%}
.btn small{display:block;font-weight:500;font-size:13px;opacity:.85}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}

.topics{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topic{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:11px 14px;text-align:left;cursor:pointer;min-height:56px}
.topic:first-child{border-top:0}
.topic .tn{flex:1;min-width:0}
.topic .tn b{display:block;font-size:16px;font-weight:600}
.topic .tn span{font-size:13px;color:var(--muted)}
.topic .pct{font:700 18px/1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--muted);min-width:42px;text-align:right}
.topic .pct.good{color:var(--ok)} .topic .pct.weak{color:var(--bad)}
.chev{color:var(--muted)}
.chipline{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--muted)}
.switch{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.switch[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* question */
.lane{display:grid;grid-template-columns:repeat(var(--n,15),1fr);gap:4px;align-items:center}
.lane i{height:6px;border-radius:2px;background:var(--lane)}
.lane i.cur{background:var(--fg)} .lane i.ok{background:var(--ok)} .lane i.bad{background:var(--bad)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{font:700 18px/1 var(--f-disp);color:var(--fg);letter-spacing:.02em}
.timer{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:999px;padding:1px 10px}
.plate{align-self:center;width:136px;height:136px;display:grid;place-items:center;background:var(--sunk);border-radius:12px}
.plate svg{width:112px;height:112px;display:block}
.qt{font-size:19px;font-weight:600;line-height:1.35;margin:0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer;font-size:16.5px;line-height:1.35}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font:700 16px/1 var(--f-disp);color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--fg)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);color:var(--accent-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:var(--accent-ink)}
.opt.dim{opacity:.6}
.fb{border-radius:12px;padding:12px 14px;font-size:15.5px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-size:16px} .fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}

/* result */
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.score .num{font:700 68px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.score .num small{font-size:34px;color:var(--muted)}
.verdict{font-weight:700;font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.score p{margin:0;color:var(--muted);font-size:15px;max-width:42ch}
.review{display:flex;flex-direction:column;gap:10px}
.ritem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.ritem svg{width:52px;height:52px;flex:none}
.ritem div{min-width:0;font-size:15px}
.ritem .rq{font-weight:600} .ritem .ra{color:var(--ok)}

.school{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.school p{margin:0;font-size:15px;color:var(--muted)}
.school .num2{font-weight:700;color:var(--fg);user-select:all;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.school .acts{display:flex;flex-direction:column;gap:8px}
.btn.wa.ghost{background:var(--surface);color:var(--ok);border:1.5px solid var(--ok)}
/* lessons form */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;border:0;margin:0;padding:0;min-width:0}
.fld>label,.fld legend{font-weight:600;font-size:15.5px;padding:0;margin-bottom:6px}
.fld input[type=text],.fld input[type=tel]{font:inherit;font-size:18px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px;background:var(--surface);color:var(--fg);width:100%}
.fld input:focus{border-color:var(--fg);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:15.5px;background:var(--surface)}
.chips input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.err{color:var(--bad);font-size:15px;margin:0;font-weight:600}
.done{background:var(--surface);border:1px solid var(--ok);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.done .tick{width:52px;height:52px;border-radius:50%;background:var(--ok);color:var(--accent-ink);display:grid;place-items:center;font-size:28px;font-weight:700}
.done h1{font-size:23px}
.done p{margin:0;font-size:16px}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15.5px;margin:0}
.kv2 dt{color:var(--muted)} .kv2 dd{margin:0;font-weight:600}
.ref{font:700 22px/1 var(--f-disp);letter-spacing:.04em;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;max-width:calc(100% - 32px);font-size:15px}
@media (prefers-reduced-motion:no-preference){.q,.score,.ready{animation:in .22s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
</style>
<script src="../config.js"></script>
<script src="bank.js"></script>
</head>
<body>
<div class="shell">
  <header class="top" id="hdr"></header>
  <div class="scroll" id="scroll"><div class="wrap" id="root"></div></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ================= settings ================= */
const ROUND = 15, PASS = 12, SECONDS = 30, READY_TESTS = 3, READY_SEEN = 0.7;
const QUIZ_URL = 'https://vnsr.github.io/soni-motor/quiz/';
const API_URL = (window.SONI_CONFIG && window.SONI_CONFIG.API_URL) || '';
const BANK = (window.BANK || []).map(q => Object.assign({ id: hash((q.s || '') + '|' + q.en[0]) }, q));
const SIGNS = window.SIGNS || {};
const TOPICS = ['signs', 'signals', 'priority', 'driving', 'parking', 'documents', 'safety', 'emergency', 'law'];

const TXT = {
  en: { brand: 'Soni Motor', sub: 'Training School · Karelibaug, Vadodara', title: 'Learner\'s licence practice',
    intro: `${BANK.length} questions on road signs and rules, in Gujarati and English. Free, no sign-up.`,
    ready: 'Ready for the test', notReady: 'Needs more practice', notStarted: 'Not started yet',
    readyHow: `Ready = ${READY_TESTS} tests in a row with ${PASS} or more out of ${ROUND}, and ${Math.round(READY_SEEN * 100)}% of the questions seen.`,
    inARow: 'Tests passed in a row', seen: 'Questions seen', weakest: 'Practise next', takeTest: 'Take a test', takeTestSub: `${ROUND} questions`,
    practice: 'Practice', practiceSub: 'One topic or all', all: 'All topics', topics: 'Practise by topic', timer: 'Timer', on: 'On', off: 'Off',
    timerHint: `${SECONDS} seconds per question in tests`,
    topic: { signs: 'Road signs', signals: 'Signals and road markings', priority: 'Right of way and overtaking', driving: 'Driving and lanes', parking: 'Parking and stopping', documents: 'Licence and documents', safety: 'Safety and the vehicle', emergency: 'Emergencies and accidents', law: 'Law and offences' },
    seenOf: (a, b) => `${a} of ${b} seen`, q: (i, n) => `Question ${i} of ${n}`, score: 'Correct', next: 'Next question', finish: 'See result',
    right: 'Correct', wrong: 'Not quite', timeUp: 'Time is up', answer: 'Answer', pass: 'Passed this test', fail: 'Below the pass mark',
    passTxt: 'Good. Keep going until you pass three in a row.', failTxt: `Read the answers below and practise your weakest topic. Aim for ${PASS} or more out of ${ROUND}.`,
    again: 'New test', practiseWeak: t => `Practise: ${t}`, home: 'Home', missed: 'Check these', allRight: 'You answered every question correctly.',
    endPractice: 'End practice', practiceMeta: (a, c) => `${a} answered · ${c} correct`,
    bookT: 'Learn to drive with Soni Motor', bookP: 'Car training with a patient instructor, from the first lesson to the RTO test. Fill in the form, then visit our office to get started.',
    join: 'Start driving lessons', joinSub: 'Fill this in, then visit our office to get started.',
    fName: 'Your name', fPhone: 'Mobile number', fGear: 'Car', gear: { manual: 'Manual', automatic: 'Automatic', unsure: 'Not sure' },
    fWhen: 'Best time for lessons', when: { morning: 'Morning', afternoon: 'Afternoon', evening: 'Evening' },
    fLL: "Learner's licence", ll: { have: 'I have it', applied: 'Applied', no: 'Not yet' },
    send: 'Send my details', sending: 'Sending…', consent: 'Your name and number go only to Soni Motor Training School, so we can contact you about lessons.',
    errName: 'Please enter your name.', errPhone: 'Please enter a 10-digit mobile number.', errNet: 'Could not send. Check your internet and try again.',
    errLimit: 'Too many forms from this phone today. Please call or WhatsApp us.',
    thanks: n => `Thank you, ${n}!`, thanksP: 'We have your details. Come to our office to get started.',
    office: 'Office', hours: 'Open', contact: 'Contact', map: 'Get directions', ref: 'Your reference', refHint: 'Show this at the office.',
    joinedT: 'Your details are with the school', joinedP: 'Visit our office to get started.', fillAgain: 'Send new details', defaultAddr: 'Karelibaug, Vadodara',
    ask: 'Ask on WhatsApp', book: 'Ask on WhatsApp', bookMsg: 'Hello, I am using your learner licence practice and would like to know about driving lessons.',
    callUs: 'Phone / WhatsApp', share: 'Share this practice', shareResult: 'Share my result',
    shareMsg: `Free learner's licence practice in Gujarati and English from Soni Motor Training School, Vadodara: ${QUIZ_URL}?src=share`,
    shareResultMsg: (n, t) => `I scored ${n}/${t} in the free learner's licence practice test from Soni Motor Training School, Vadodara. Try it: ${QUIZ_URL}?src=share`,
    copied: 'Link copied',
    note: 'Practice questions written by the school from the rules of the road. The real RTO test uses its own questions and pass mark.',
    privacy: 'To improve this practice, the school counts test scores anonymously, without names or numbers. Your progress stays on this phone. Your name and number are sent only if you fill in the lessons form.' },
  gu: { brand: 'સોની મોટર', sub: 'ટ્રેનિંગ સ્કૂલ · કારેલીબાગ, વડોદરા', title: 'લર્નિંગ લાઇસન્સ પ્રેક્ટિસ',
    intro: `ટ્રાફિક ચિહ્નો અને નિયમો પર ${BANK.length} પ્રશ્નો, ગુજરાતી અને અંગ્રેજીમાં. મફત, નોંધણી વગર.`,
    ready: 'ટેસ્ટ માટે તૈયાર', notReady: 'હજી પ્રેક્ટિસ જોઈએ', notStarted: 'હજી શરૂ નથી કર્યું',
    readyHow: `તૈયાર = સળંગ ${READY_TESTS} ટેસ્ટમાં ${ROUND}માંથી ${PASS} કે વધુ, અને ${Math.round(READY_SEEN * 100)}% પ્રશ્નો જોયેલા.`,
    inARow: 'સળંગ પાસ થયેલી ટેસ્ટ', seen: 'જોયેલા પ્રશ્નો', weakest: 'હવે આની પ્રેક્ટિસ કરો', takeTest: 'ટેસ્ટ આપો', takeTestSub: `${ROUND} પ્રશ્નો`,

/* ================= storage (this phone only) ================= */
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('llq.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('llq.' + k, JSON.stringify(v)); } catch (e) { } }
};
const P = Object.assign({ q: {}, tests: [], timer: true }, store.get('progress', {}));   // q[id] = { n: seen, c: correct, w: 1 if last answer wrong, t: last time }
const save = () => store.set('progress', P);
let device = store.get('device', '');
if (!device) { device = Array.from({ length: 12 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join(''); store.set('device', device); }
const SRC = (/[?&]src=([a-z0-9_-]{1,20})/i.exec(location.search) || [])[1] || '';
if (SRC) store.set('src', SRC.toLowerCase());
const source = () => store.get('src', '') || 'direct';

/* ================= anonymous counts and school info ================= */
function stat(event, extra) {
  if (!API_URL) return;
  const body = JSON.stringify({ action: 'quizStat', payload: Object.assign({ Device: device, Event: event, Lang: S.lang, Source: source() }, extra || {}) });
  try { if (navigator.sendBeacon && navigator.sendBeacon(API_URL, new Blob([body], { type: 'text/plain' }))) return; } catch (e) { }
  fetch(API_URL, { method: 'POST', body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, keepalive: true }).catch(() => { });
}
let school = store.get('school', { phone: '' });
if (API_URL) fetch(API_URL + '?public=1').then(r => r.json()).then(r => { if (r && r.ok) { school = { phone: r.phone || '', name: r.school || '', contact: r.contact || '', address: r.address || '', hours: r.hours || '', map: r.map || '' }; store.set('school', school); render(); } }).catch(() => { });

/* ================= state ================= */
const S = { lang: store.get('lang', 'gu'), view: 'home', set: [], i: 0, answers: [], topic: null, cur: null, pa: 0, pc: 0, timerEnd: 0 };
const T = () => TXT[S.lang];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = id => document.getElementById(id);

function record(q, ok) {
  const r = P.q[q.id] || (P.q[q.id] = { n: 0, c: 0, w: 0, t: 0 });
  r.n++; if (ok) r.c++; r.w = ok ? 0 : 1; r.t = Date.now(); save();
}
function topicStats(t) {
  const qs = BANK.filter(q => q.t === t); let seen = 0, n = 0, c = 0;
  qs.forEach(q => { const r = P.q[q.id]; if (r) { seen++; n += r.n; c += r.c; } });
  return { total: qs.length, seen, acc: n ? c / n : null, n };
}
function readiness() {
  const seen = BANK.filter(q => P.q[q.id]).length, share = seen / BANK.length;
  let row = 0; for (let i = P.tests.length - 1; i >= 0 && P.tests[i].s >= PASS; i--) row++;
  const status = !P.tests.length && !seen ? 'none' : (row >= READY_TESTS && share >= READY_SEEN ? 'yes' : 'no');
  const cand = TOPICS.map(t => Object.assign({ t }, topicStats(t)));
  const tried = cand.filter(x => x.n >= 4 && x.acc != null).sort((a, b) => a.acc - b.acc);
  const weakest = tried.length && tried[0].acc < 0.85 ? tried[0].t : cand.sort((a, b) => a.seen / a.total - b.seen / b.total)[0].t;
  return { seen, share, row, status, weakest };
}

/* question picking: wrong ones first, then unseen, then the longest-ago seen */
function nextPractice() {
  const pool = BANK.filter(q => !S.topic || q.t === S.topic).filter(q => !S.cur || q.id !== S.cur.q.id);
  const wrong = pool.filter(q => P.q[q.id] && P.q[q.id].w), unseen = pool.filter(q => !P.q[q.id]);
  let pick;
  if (wrong.length && Math.random() < 0.6) pick = shuffle(wrong)[0];
  else if (unseen.length) pick = shuffle(unseen)[0];
  else pick = pool.slice().sort((a, b) => P.q[a.id].t - P.q[b.id].t).slice(0, 8).sort(() => Math.random() - .5)[0];
  return { q: pick, order: shuffle([1, 2, 3]), ans: null };
}
function newTest() {
  const signs = shuffle(BANK.filter(q => q.s)), rest = shuffle(BANK.filter(q => !q.s));
  S.set = shuffle([...signs.slice(0, 5), ...rest.slice(0, ROUND - 5)]).map(q => ({ q, order: shuffle([1, 2, 3]), ans: null }));
  S.i = 0; S.view = 'test'; startTimer();
}

/* ================= timer (tests only) ================= */
let tick = null;
function startTimer() {
  clearInterval(tick); if (!P.timer) return;
  S.timerEnd = Date.now() + SECONDS * 1000;
  tick = setInterval(() => {
    const el = $('tbar'), left = S.timerEnd - Date.now();
    if (el) el.style.transform = `scaleX(${Math.max(0, left / (SECONDS * 1000))})`;
    const sec = $('tsec'); if (sec) sec.textContent = Math.max(0, Math.ceil(left / 1000)) + 's';
    if (left <= 0) { clearInterval(tick); const it = S.set[S.i]; if (it && !it.ans) { it.ans = { pick: 0, ok: false, late: true }; record(it.q, false); render(); } }
  }, 250);
}

/* ================= rendering ================= */
function header() {
  const t = T(), inner = S.view !== 'home';
  $('hdr').innerHTML = `${inner ? `<button class="back" id="hBack" aria-label="${t.home}">‹</button>` : '<div class="lplate" aria-hidden="true">L</div>'}
    <div class="brand"><b>${t.brand}</b><span>${t.sub}</span></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="lgGu" aria-pressed="${S.lang === 'gu'}">ગુ</button><button type="button" id="lgEn" aria-pressed="${S.lang === 'en'}">EN</button></div>`;
  $('lgGu').onclick = () => setLang('gu'); $('lgEn').onclick = () => setLang('en');
  if (inner) $('hBack').onclick = goHome;
}
function setLang(l) { S.lang = l; store.set('lang', l); render(); }
function goHome() { clearInterval(tick); S.view = 'home'; S.cur = null; render(); $('scroll').scrollTop = 0; }
function render() {
  document.documentElement.lang = S.lang;
  header();
  ({ home: renderHome, test: renderTest, result: renderResult, practice: renderPractice, join: renderJoin, joined: renderJoined })[S.view]();
}

const schoolPhone = () => String(school.phone || '').replace(/\D/g, '').slice(-10);
function waLink(cls) {
  const t = T(), ph = schoolPhone();
  return ph ? `<a class="btn wa ${cls || ''} full" id="bBook" href="https://wa.me/91${ph}?text=${encodeURIComponent(t.bookMsg)}" target="_blank" rel="noopener">${t.ask}</a>` : '';
}
function officeInfo() {
  const t = T(), ph = schoolPhone(), addr = school.address || t.defaultAddr;
  const map = school.map || (school.address ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent('Soni Motor Training School, ' + school.address) : '');
  return `<dl class="kv2"><dt>${t.office}</dt><dd>${esc(addr)}</dd>${school.hours ? `<dt>${t.hours}</dt><dd>${esc(school.hours)}</dd>` : ''}${school.contact ? `<dt>${t.contact}</dt><dd>${esc(school.contact)}</dd>` : ''}${ph ? `<dt>${t.callUs}</dt><dd><a href="tel:+91${ph}" style="color:inherit">+91 ${ph.slice(0, 5)} ${ph.slice(5)}</a></dd>` : ''}</dl>
    ${map ? `<a class="btn ghost full" href="${esc(map)}" target="_blank" rel="noopener">${t.map}</a>` : ''}`;
}
function schoolCard() {
  const t = T(), j = store.get('joined', null);
  if (j && j.ref) return `<section class="school"><h2>${t.joinedT}</h2><p>${t.joinedP} ${t.ref}: <b class="num2">${esc(j.ref)}</b></p>${officeInfo()}${waLink('ghost')}</section>`;
  return `<section class="school"><h2>${t.bookT}</h2><p>${t.bookP}</p>
    <div class="acts">${API_URL ? `<button class="btn primary full" id="bJoin">${t.join}</button>` : ''}${waLink(API_URL ? 'ghost' : '')}</div>
    ${officeInfo()}
  </section>`;
}
function wireCommon() {
  const b = $('bBook'); if (b) b.addEventListener('click', () => stat('book'));
  const jb = $('bJoin'); if (jb) jb.onclick = () => { S.view = 'join'; S.formErr = ''; render(); $('scroll').scrollTop = 0; };
  document.querySelectorAll('[data-share]').forEach(x => x.onclick = () => shareText(x.dataset.share === 'result' ? T().shareResultMsg(x.dataset.n, x.dataset.t) : T().shareMsg));
}
async function shareText(text) {
  stat('share');
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
}

  $('root').innerHTML = `
    <div><h1>${t.title}</h1><p class="intro">${t.intro}</p></div>
    <section class="ready ${cls}" aria-live="polite">
      <div class="st"><span class="dot"></span><b>${R.status === 'yes' ? t.ready : R.status === 'no' ? t.notReady : t.notStarted}</b></div>

        <span>${t.seen}</span><span class="v">${R.seen} / ${BANK.length}</span>
        <span class="bar"><i style="width:${Math.min(1, R.share / READY_SEEN) * 100}%"></i></span>
      </div>
      ${last.length ? `<div class="pips" aria-hidden="true">${last.map(x => `<i class="${x.s >= PASS ? 'ok' : 'bad'}" title="${x.s}/${x.n}"></i>`).join('')}</div>` : ''}
      <p class="sub">${R.status !== 'yes' && R.status !== 'none' ? `${t.weakest}: <b>${esc(t.topic[R.weakest])}</b>. ` : ''}${t.readyHow}</p>
    </section>
    <div class="row2">
      <button class="btn primary" id="bTest">${t.takeTest}<small>${t.takeTestSub}</small></button>

    <div class="chipline">${t.timer}: <button class="switch" id="bTimer" aria-pressed="${P.timer}">${P.timer ? t.on : t.off}</button><span>${t.timerHint}</span></div>
    <section><h2 style="margin-bottom:8px">${t.topics}</h2><div class="topics">
      <button class="topic" data-topic=""><span class="tn"><b>${t.all}</b><span>${t.seenOf(R.seen, BANK.length)}</span></span><span class="chev">›</span></button>
      ${TOPICS.map(k => { const s = topicStats(k), pct = s.acc == null ? '–' : Math.round(s.acc * 100) + '%';
        return `<button class="topic" data-topic="${k}"><span class="tn"><b>${esc(t.topic[k])}</b><span>${t.seenOf(s.seen, s.total)}</span></span><span class="pct ${s.acc == null ? '' : s.acc >= .85 ? 'good' : s.acc < .6 ? 'weak' : ''}">${pct}</span><span class="chev">›</span></button>`; }).join('')}
    </div></section>
    ${schoolCard()}
    <button class="btn ghost full" data-share="quiz">${t.share}</button>
    <p class="note">${t.note}</p><p class="note">${t.privacy}</p>`;
  $('bTest').onclick = () => { newTest(); render(); $('scroll').scrollTop = 0; };
  $('bPractice').onclick = () => startPractice(null);
  $('bTimer').onclick = () => { P.timer = !P.timer; save(); render(); };
  document.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => startPractice(b.dataset.topic || null));
  wireCommon();
}
function startPractice(topic) { clearInterval(tick); S.view = 'practice'; S.topic = topic; S.pa = 0; S.pc = 0; S.cur = nextPractice(); render(); $('scroll').scrollTop = 0; }

function questionCard(item, onPick) {
  const t = T(), q = item.q, L = q[S.lang], ans = item.ans;
  const html = `<section class="q" aria-live="polite">
      <span class="tag">${esc(t.topic[q.t])}</span>
      ${q.s && SIGNS[q.s] ? `<div class="plate">${SIGNS[q.s]}</div>` : ''}
      <p class="qt">${esc(L[0])}</p>
      <div class="opts">${item.order.map((o, k) => {
        let cls = ''; if (ans) cls = o === 1 ? 'right' : (o === ans.pick ? 'wrong' : 'dim');
        return `<button type="button" class="opt ${cls}" data-o="${o}" ${ans ? 'disabled' : ''}><span class="k">${'ABC'[k]}</span><span>${esc(L[o])}</span></button>`;
      }).join('')}</div>
      ${ans ? `<div class="fb ${ans.ok ? 'ok' : 'bad'}"><b>${ans.ok ? '✓ ' + t.right : ans.late ? '⏱ ' + t.timeUp : '✗ ' + t.wrong}</b><span>${esc(L[4])}</span></div>` : ''}
      <div id="qNext"></div>
    </section>`;
  return { html, wire: () => document.querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () => onPick(+b.dataset.o)) };
}

function renderTest() {
  const t = T(), item = S.set[S.i], nRight = S.set.filter(x => x.ans && x.ans.ok).length;
  const c = questionCard(item, o => { clearInterval(tick); item.ans = { pick: o, ok: o === 1 }; record(item.q, o === 1); render(); focusNext(); });
  $('root').innerHTML = `
    <div class="lane" style="--n:${S.set.length}" aria-hidden="true">${S.set.map((x, k) => `<i class="${x.ans ? (x.ans.ok ? 'ok' : 'bad') : k === S.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="meta"><span>${t.q(S.i + 1, S.set.length)}</span>${P.timer && !item.ans ? `<span id="tsec">${Math.max(0, Math.ceil((S.timerEnd - Date.now()) / 1000))}s</span>` : ''}<span>${t.score}: <b>${nRight}</b></span></div>
    ${P.timer && !item.ans ? `<div class="timer"><i id="tbar" style="transform:scaleX(${Math.max(0, (S.timerEnd - Date.now()) / (SECONDS * 1000))})"></i></div>` : ''}
    ${c.html}`;
  c.wire();
  if (item.ans) {
    $('qNext').outerHTML = `<button type="button" class="btn primary full" id="next">${S.i + 1 < S.set.length ? t.next : t.finish}</button>`;
    $('next').onclick = () => { if (S.i + 1 < S.set.length) { S.i++; startTimer(); } else finishTest(); render(); $('scroll').scrollTop = 0; };
  }
}
function focusNext() { const n = $('next'); if (n) { n.focus({ preventScroll: true }); n.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
function finishTest() {
  clearInterval(tick);
  const n = S.set.filter(x => x.ans && x.ans.ok).length;
  P.tests.push({ s: n, n: S.set.length, d: Date.now() }); P.tests = P.tests.slice(-30); save();
  const R = readiness();
  stat('test', { Score: n, Total: S.set.length, Ready: R.status === 'yes' ? 'yes' : 'no' });
  S.view = 'result';
}
function renderResult() {
  const t = T(), n = S.set.filter(x => x.ans && x.ans.ok).length, pass = n >= PASS, R = readiness();
  const missed = S.set.filter(x => !x.ans || !x.ans.ok);
  $('root').innerHTML = `
    <div class="lane" style="--n:${S.set.length}" aria-hidden="true">${S.set.map(x => `<i class="${x.ans && x.ans.ok ? 'ok' : 'bad'}"></i>`).join('')}</div>
    <section class="score" aria-live="polite">
      <div class="num">${n}<small>/${S.set.length}</small></div>
      <div class="verdict ${pass ? 'ok' : 'bad'}">${pass ? t.pass : t.fail}</div>
      <p>${pass ? t.passTxt : t.failTxt}</p>
    </section>
    <section class="ready ${R.status === 'yes' ? 'yes' : 'no'}"><div class="st"><span class="dot"></span><b>${R.status === 'yes' ? t.ready : t.notReady}</b></div>
      <p class="sub">${t.inARow}: <b>${Math.min(R.row, READY_TESTS)} / ${READY_TESTS}</b> · ${t.seen}: <b>${R.seen} / ${BANK.length}</b></p></section>
    <div class="row2"><button class="btn primary" id="again">${t.again}</button><button class="btn ghost" id="weak">${esc(t.practiseWeak(t.topic[R.weakest]))}</button></div>
    <button class="btn ghost full" data-share="result" data-n="${n}" data-t="${S.set.length}">${t.shareResult}</button>
    <section class="review"><h2>${missed.length ? t.missed : t.allRight}</h2>
      ${missed.map(({ q }) => { const L = q[S.lang]; return `<div class="ritem">${q.s && SIGNS[q.s] ? SIGNS[q.s] : ''}<div><div class="rq">${esc(L[0])}</div><div class="ra">${t.answer}: ${esc(L[1])}</div><div>${esc(L[4])}</div></div></div>`; }).join('')}
    </section>
    ${schoolCard()}
    <p class="note">${t.note}</p>`;
  $('again').onclick = () => { newTest(); render(); $('scroll').scrollTop = 0; };
  $('weak').onclick = () => startPractice(R.weakest);
  wireCommon();
}

function renderPractice() {
  const t = T(), item = S.cur;
  const c = questionCard(item, o => { item.ans = { pick: o, ok: o === 1 }; S.pa++; if (o === 1) S.pc++; record(item.q, o === 1); render(); focusNext(); });
  $('root').innerHTML = `
    <div class="meta"><span><b style="font-family:var(--f-body);font-size:16px">${esc(S.topic ? t.topic[S.topic] : t.all)}</b></span><span>${t.practiceMeta(S.pa, S.pc)}</span></div>
    ${c.html}
    <button class="btn ghost full" id="endP">${t.endPractice}</button>`;
  c.wire();
  if (item.ans) {
    $('qNext').outerHTML = `<button type="button" class="btn primary full" id="next">${t.next}</button>`;
    $('next').onclick = () => { S.cur = nextPractice(); render(); $('scroll').scrollTop = 0; };
  }
  $('endP').onclick = goHome;
}

/* ================= lessons form ================= */
function chips(name, opts, cur) {
  return `<div class="chips" role="radiogroup">${Object.keys(opts).map(k => `<label><input type="radio" name="${name}" value="${k}" ${cur === k ? 'checked' : ''}><span>${esc(opts[k])}</span></label>`).join('')}</div>`;
}
function renderJoin() {
  const t = T(), f = S.form || (S.form = { Name: '', Phone: '', Gear: '', When: '', Licence: '' });
  $('root').innerHTML = `
    <div><h1>${t.join}</h1><p class="intro">${t.joinSub}</p></div>
    <form class="form" id="jForm" novalidate>
      <div class="fld"><label for="jName">${t.fName}</label><input type="text" id="jName" autocomplete="name" maxlength="60" value="${esc(f.Name)}" required></div>
      <div class="fld"><label for="jPhone">${t.fPhone}</label><input type="tel" id="jPhone" autocomplete="tel" inputmode="numeric" maxlength="16" placeholder="98765 43210" value="${esc(f.Phone)}" required></div>
      <fieldset class="fld"><legend>${t.fGear}</legend>${chips('Gear', t.gear, f.Gear)}</fieldset>
      <fieldset class="fld"><legend>${t.fWhen}</legend>${chips('When', t.when, f.When)}</fieldset>
      <fieldset class="fld"><legend>${t.fLL}</legend>${chips('Licence', t.ll, f.Licence)}</fieldset>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" id="jWeb" tabindex="-1" autocomplete="off"></label></div>
      ${S.formErr ? `<p class="err" role="alert">${S.formErr}</p>` : ''}
      <button class="btn primary full" type="submit" id="jSend">${t.send}</button>
      <p class="note">${t.consent}</p>
    </form>
    ${waLink('ghost')}`;
  const read = () => { const fd = new FormData($('jForm')); Object.assign(f, { Name: $('jName').value.trim(), Phone: $('jPhone').value.trim(), Gear: fd.get('Gear') || '', When: fd.get('When') || '', Licence: fd.get('Licence') || '' }); };
  $('jForm').onchange = read;
  $('jForm').onsubmit = async ev => {
    ev.preventDefault(); read();
    let ph = f.Phone.replace(/\D/g, ''); if (ph.length === 12 && ph.startsWith('91')) ph = ph.slice(2); if (ph.length === 11 && ph[0] === '0') ph = ph.slice(1);
    const err = f.Name.length < 2 ? t.errName : !/^[6-9]\d{9}$/.test(ph) ? t.errPhone : '';
    if (err) { S.formErr = err; render(); $(f.Name.length < 2 ? 'jName' : 'jPhone').focus(); return; }
    const btn = $('jSend'); btn.disabled = true; btn.textContent = t.sending;
    try {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'publicEnquiry', payload: { Name: f.Name, Phone: ph, Gear: f.Gear, When: f.When, Licence: f.Licence, Website: $('jWeb').value, Device: device, Source: source(), Lang: S.lang } }) });
      const r = await res.json();
      if (!r.ok) { S.formErr = r.error === 'PHONE' ? t.errPhone : r.error === 'NAME' ? t.errName : r.error === 'LIMIT' ? t.errLimit : t.errNet; render(); return; }
      store.set('joined', { ref: r.ref, name: f.Name, d: Date.now() }); stat('form');
      S.formErr = ''; S.view = 'joined'; render(); $('scroll').scrollTop = 0;
    } catch (e) { S.formErr = t.errNet; render(); }
  };
  wireCommon();
}
function renderJoined() {
  const t = T(), j = store.get('joined', {}) || {};
  $('root').innerHTML = `
    <section class="done" aria-live="polite">
      <div class="tick" aria-hidden="true">✓</div>
      <h1>${esc(t.thanks((j.name || '').split(' ')[0]))}</h1>
      <p>${t.thanksP}</p>
      ${j.ref ? `<div><p class="sub">${t.ref}</p><div class="ref">${esc(j.ref)}</div><p class="sub">${t.refHint}</p></div>` : ''}
      ${officeInfo()}
    </section>
    ${waLink('ghost')}
    <button class="btn ghost full" id="jHome">${t.home}</button>
    <button class="btn ghost full" id="jAgain" style="min-height:44px;font-weight:500;border:0">${t.fillAgain}</button>`;
  $('jHome').onclick = goHome;
  $('jAgain').onclick = () => { store.set('joined', null); S.view = 'join'; render(); };
  wireCommon();
}

render();
stat('open');
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
